  <!-- Door opening -->
  <rect x="150" y="190" width="300" height="170" fill="#10243a"/>
  <g stroke="#f5a623" stroke-width="3" opacity="0.4">
    <path d="M150 210 H450 M150 230 H450"/>
  </g>
  <!-- Shelf -->
  <g fill="#d98a0b">
    <rect x="165" y="290" width="270" height="6"/>
